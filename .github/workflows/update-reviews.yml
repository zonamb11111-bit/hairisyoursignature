name: Update Google review stats

# 毎日1回、kommons-gbp GAS の review-stats エンドポイントから
# Google クチコミの平均評価・件数を取得し、index.html の
# (a) JSON-LD aggregateRating と (b) 表示テキストを更新する。
# 数字が変わったときだけ commit→push（Cloudflare Pages が自動再ビルド）。

on:
  schedule:
    - cron: '0 20 * * *'   # 20:00 UTC = 翌 05:00 JST
  workflow_dispatch:
    inputs:
      allow_drop:
        description: 'クチコミ件数の減少を承知の上で反映する（原因を確認済みのときだけ true）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch review stats from kommons-gbp
        id: fetch
        env:
          ENDPOINT: ${{ secrets.GBP_REVIEW_STATS_URL }}
          TOKEN: ${{ secrets.GBP_REVIEW_STATS_TOKEN }}
        run: |
          set -euo pipefail
          # GAS Web アプリは 302 で googleusercontent.com に飛ぶので -L で追従
          resp=$(curl -sSL "${ENDPOINT}?action=review-stats&token=${TOKEN}")
          echo "raw response: $resp"
          ok=$(echo "$resp" | jq -r '.ok')
          if [ "$ok" != "true" ]; then
            echo "::error::review-stats returned not-ok: $resp"
            exit 1
          fi
          rating=$(echo "$resp" | jq -r '.ratingValue')
          count=$(echo "$resp" | jq -r '.reviewCount')
          # sanity check: rating は 0-5 の小数1桁、count は1以上の整数
          if ! echo "$rating" | grep -Eq '^[0-5](\.[0-9])?$'; then
            echo "::error::bad ratingValue: $rating"; exit 1
          fi
          if ! echo "$count" | grep -Eq '^[0-9]+$' || [ "$count" -lt 1 ]; then
            echo "::error::bad reviewCount: $count"; exit 1
          fi
          # クチコミ死守の見張り：前回（index.html に入っている件数）より3件以上減ったら止める。
          # 失敗すると GitHub からリポジトリ所有者にメールが届く。サイトの数字は更新しない。
          prev=$(grep -oE 'const REVIEW_COUNT = [0-9]+' index.html | grep -oE '[0-9]+$' || echo 0)
          echo "previous count: $prev / new count: $count"
          if [ "$prev" -gt 0 ] && [ $((prev - count)) -ge 3 ] && [ "${{ github.event.inputs.allow_drop }}" != "true" ]; then
            echo "::error::Googleクチコミが減少: ${prev} -> ${count}（${prev}から$((prev - count))件減）。GBPの名前・住所変更の直後なら要確認。控え(backupAllReviews)と照合し、必要ならクチコミ移動の窓口へ。原因確認後は allow_drop=true で手動実行"
            exit 1
          fi
          echo "rating=$rating" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Update index.html
        env:
          RATING: ${{ steps.fetch.outputs.rating }}
          COUNT: ${{ steps.fetch.outputs.count }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          rating = os.environ["RATING"]
          count = os.environ["COUNT"]
          with open("index.html", encoding="utf-8") as f:
              html = f.read()
          # (a) JSON-LD aggregateRating（Google が読む構造化データ・最重要）
          html, n_a = re.subn(
              r'("aggregateRating":\{"@type":"AggregateRating","ratingValue":")[^"]*(","reviewCount":")[^"]*(")',
              lambda m: m.group(1) + rating + m.group(2) + count + m.group(3),
              html,
          )
          # (b) 人が見る表示テキスト
          html, n_b = re.subn(
              r'(<dt>Rating</dt><dd>)[0-9.]+ / 5 from [0-9]+ Google reviews(</dd>)',
              lambda m: m.group(1) + rating + " / 5 from " + count + " Google reviews" + m.group(2),
              html,
          )
          # (c) JS定数（画面右下の★バッジ・口コミ欄が参照する数字）
          html, n_c = re.subn(
              r'(const REVIEW_COUNT = )\d+(;)',
              lambda m: m.group(1) + count + m.group(2),
              html,
          )
          if n_a != 1 or n_b != 1 or n_c != 1:
              raise SystemExit(f"unexpected match counts: jsonld={n_a} display={n_b} jsconst={n_c} (expected 1/1/1)")
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)
          print(f"updated jsonld={n_a} display={n_b} jsconst={n_c} -> {rating} / {count}")
          PY

      - name: Commit if changed
        env:
          RATING: ${{ steps.fetch.outputs.rating }}
          COUNT: ${{ steps.fetch.outputs.count }}
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "Review stats unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update Google review stats (${RATING} / ${COUNT})"
          git push
